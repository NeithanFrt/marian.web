<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Marian xdd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="ddlc-character-container">
            <img id="character-sprite" class="character" src="" alt="Personaje">
        </div>

        <div class="ddlc-textbox" id="dialogue-box">
            <div class="ddlc-name-box">
                <span id="ddlc-character-name">Neithan pero gato xd</span>
            </div>
            <div class="ddlc-dialogue-content">
                <p id="ddlc-dialogue-text"></p>
            </div>
            <div class="ddlc-next-indicator"></div>
        </div>
    </div>

    <!-- Elemento de audio para la voz de texto (asegúrate de que voice.mp3 esté en la misma carpeta o ruta correcta) -->
    <audio id="voice-sound" src="Media/voice.mp3" preload="auto" loop></audio>

    <script src="script.js"></script>

</body>
</html>
